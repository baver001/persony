name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: persony-deploy-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate i18n JSON
        run: npm run validate:i18n

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: https://beta.persony.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Apply D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy health check
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -s https://beta.persony.org/api/health)
            status=$(curl -s -o /dev/null -w "%{http_code}" https://beta.persony.org/api/health)
            if [ "$status" = "200" ]; then
              echo "$body"
              git_sha=$(echo "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).gitSha||'')}catch{console.log('')}})")
              expected_prefix=$(echo "$EXPECTED_SHA" | cut -c1-12)
              if [ -z "$git_sha" ] || [ "$git_sha" = "dev" ]; then
                echo "::warning::Health OK but gitSha missing or dev ($git_sha)"
              elif [ "$git_sha" != "$expected_prefix" ]; then
                echo "::warning::gitSha=$git_sha does not match deploy commit prefix $expected_prefix (CDN/propagation lag?)"
              else
                echo "Health check passed with gitSha=$git_sha"
              fi
              exit 0
            fi
            echo "Health check attempt $attempt failed (HTTP $status), retrying..."
            sleep 5
          done
          echo "::error::Production health check failed after deploy"
          exit 1

      - name: Post-deploy economics smoke (public + D1)
        env:
          SMOKE_BASE_URL: https://beta.persony.org
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run smoke:economics
