<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222226" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#0f0f11" />
    </linearGradient>
    <linearGradient id="planeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E4E4E7" />
    </linearGradient>
    <linearGradient id="planeFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4D4D8" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
    <linearGradient id="planeBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717A" />
      <stop offset="100%" stop-color="#52525B" />
    </linearGradient>
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A1A1AA" />
      <stop offset="100%" stop-color="#52525B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background squircle (App Icon & PWA) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="#27272a" stroke-width="6" opacity="0.8" />

  <!-- Voice Waves / Sound Frequency behind plane -->
  <g opacity="0.4" transform="translate(0, 10)">
    <rect x="74" y="240" width="10" height="32" rx="5" fill="url(#waveGlow)" />
    <rect x="94" y="220" width="10" height="72" rx="5" fill="url(#waveGlow)" />
    <rect x="114" y="200" width="10" height="112" rx="5" fill="url(#waveGlow)" />
  </g>

  <!-- Modern Paper Plane (Messenger Symbol) with Shaded Facets -->
  <g filter="url(#shadow)">
    <!-- Right / Main top wing -->
    <path d="M140 258 L392 144 C402 140 412 150 408 160 L336 368 C332 378 318 382 310 372 L244 294 Z" fill="url(#planeBody)" />
    
    <!-- Left / Underside wing -->
    <path d="M140 258 L244 294 L196 346 C190 352 180 348 180 339 L180 286 Z" fill="url(#planeBack)" />
    
    <!-- Central fold / rudder crease -->
    <path d="M244 294 L392 144 L196 346 L216 322 Z" fill="url(#planeFold)" opacity="0.85" />
  </g>

  <!-- Live Pulse Dot (Indicating Live Gemini Connection) -->
  <circle cx="410" cy="144" r="14" fill="#22c55e" />
  <circle cx="410" cy="144" r="22" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.6" />
</svg>
